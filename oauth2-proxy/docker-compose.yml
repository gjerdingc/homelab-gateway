# Portainer stack: oauth2-proxy (Google sign-in for apps behind Traefik)
# Repository gjerdingc/traefik-lab-lb, compose path oauth2-proxy/docker-compose.yml
# (or paste this into the Portainer web editor).
#
# Stack environment variables (set in Portainer, never committed):
#   OAUTH_CLIENT_ID      Google OAuth client ID (Web application)
#   OAUTH_CLIENT_SECRET  Google OAuth client secret
#   OAUTH_COOKIE_SECRET  32 random bytes:  openssl rand -base64 32 | tr -- '+/' '-_'
#   SSO_DOMAIN           optional, default oplassen.net
#
# Before deploying, create the allow-list on the host, one email address per line:
#   /opt/oauth2-proxy/emails.txt
# If the file is missing, Docker creates a directory in its place and oauth2-proxy fails to start.
#
# Traefik reaches the container as http://oauth2-proxy:4180 on the proxy network.
# No host port: only Traefik may talk to it.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: oauth2-proxy
    restart: unless-stopped
    environment:
      TZ: Europe/Oslo
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: https://auth.${SSO_DOMAIN:-oplassen.net}/oauth2/callback
      # One sign-in for every app under the domain
      OAUTH2_PROXY_COOKIE_DOMAINS: .${SSO_DOMAIN:-oplassen.net}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${SSO_DOMAIN:-oplassen.net}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      # Behind Traefik: trust X-Forwarded-* and answer ForwardAuth with identity headers
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SCOPE: openid email profile
      # Only the addresses in this file may sign in
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/emails.txt
    volumes:
      - /opt/oauth2-proxy/emails.txt:/etc/oauth2-proxy/emails.txt:ro
    networks: [proxy]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
