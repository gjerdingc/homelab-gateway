# Traefik + Traefik Manager.
#
# Portainer / Dockhand: add a stack from this repository (compose path docker-compose.yml) and set the
# variables below in the stack's environment variables.
# Plain Docker:         cp .env.example .env, edit it, then: docker compose up -d
#
# Every variable is listed with an example in .env.example; the README explains them.
# Before the first deploy: create the proxy network (see "Install" in the README). On first start the
# manager creates its own CA; download its root certificate from the Status page.
services:
  traefik:
    image: traefik:v3.7.19
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command:
      - --log.level=INFO
      # JSON access log in a file; the manager reads it for the Usage and Traffic pages
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filepath=/var/log/traefik/access.log
      # Headers kept in the log: the browser, where it came from, and the signed-in user (set by
      # oauth2-proxy on sign-in apps). Every other header is left out.
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Referer=keep
      - --accesslog.fields.headers.names.X-Auth-Request-Email=keep
      - --ping=true
      - --api.dashboard=true
      # The API listens on :8080 inside the container. That port is NOT published to the
      # host, so only containers on the proxy network (the manager) can reach it.
      - --api.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Trust internal-CA-signed HTTPS backends
      - --serversTransport.rootCAs=/pki/root/${ROOT_CA_FILE:-root_ca.crt}
      # Let's Encrypt for apps that choose it in the manager (router tls.certResolver: letsencrypt).
      # DNS-01 challenge, so the apps never have to be reachable from the internet. Harmless while no
      # app uses it; needs the DNS provider's credentials (below) once one does.
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # Provider code from https://doc.traefik.io/traefik/https/acme/#providers
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:-cloudflare}
      # Check the TXT record on public resolvers, not on the LAN DNS (which may answer
      # for the domain itself and never see the challenge record).
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=${ACME_DNS_RESOLVERS:-1.1.1.1:53,1.0.0.1:53}
    volumes:
      - ${TM_ROOT:-/opt/traefik}/dynamic:/etc/traefik/dynamic:ro
      - ${TM_ROOT:-/opt/traefik}/certs:/etc/traefik/certs:ro
      - ${TM_ROOT:-/opt/traefik}/logs:/var/log/traefik
      # Let's Encrypt account and certificates (acme.json, created by Traefik with mode 600)
      - ${TM_ROOT:-/opt/traefik}/acme:/etc/traefik/acme
      # The stack's wildcard certificate and key, written by gateway-acme (wildcard profile)
      - ${TM_ROOT:-/opt/traefik}/wildcard:/etc/traefik/wildcard:ro
      # The root CERTIFICATE's folder (a folder, so it can be mounted before the manager creates the
      # certificate on first start). Traefik never sees the intermediate key. Keep no root key here.
      - ${PKI_DIR:-/opt/traefik/pki}/root:/pki/root:ro
    environment:
      TZ: ${TZ:-UTC}
      # DNS provider credentials for the Let's Encrypt challenge. Only Traefik gets them; the manager
      # never sees them. Fill in the ones for ACME_DNS_PROVIDER and leave the rest empty.
      # Another provider: add its variables here (names are on the provider's page in the Traefik docs).
      # cloudflare: API token with Zone:DNS:Edit and Zone:Zone:Read on the zone
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      # route53 (AWS)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}
      # digitalocean
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}
      # hetzner
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      # ovh
      OVH_ENDPOINT: ${OVH_ENDPOINT:-}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:-}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}
      # porkbun
      PORKBUN_API_KEY: ${PORKBUN_API_KEY:-}
      PORKBUN_SECRET_API_KEY: ${PORKBUN_SECRET_API_KEY:-}
    networks: [proxy]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  traefik-manager:
    # Prebuilt for amd64, arm64 and armv7 by .github/workflows/image.yml.
    # Pin TM_VERSION to a release (e.g. 1.0.0) to choose when you upgrade; "latest" follows main.
    # To build from source instead, add docker-compose.build.yml (see "Updating" in docs/guide.md).
    image: ${TM_IMAGE:-ghcr.io/gjerdingc/traefik-manager}:${TM_VERSION:-latest}
    # Look for a newer image on every deploy, so a redeploy never keeps running an old "latest".
    # Set TM_PULL_POLICY=missing to skip the check (offline hosts).
    pull_policy: ${TM_PULL_POLICY:-always}
    container_name: traefik-manager
    restart: unless-stopped
    ports:
      # Break-glass access that does not go through Traefik: http://<host-ip>:8090
      # Not protected by the LAN-only middleware. Set BREAK_GLASS_PORT=<lan-ip>:8090 to listen
      # on one address only.
      - "${BREAK_GLASS_PORT:-8090}:8000"
    environment:
      TZ: ${TZ:-UTC}
      MANAGER_FQDN: ${MANAGER_FQDN}
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-true}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      LAN_CIDRS: ${LAN_CIDRS}
      CA_CERT_FILE: ${CA_CERT_FILE:-intermediate_ca.crt}
      CA_KEY_FILE: ${CA_KEY_FILE:-intermediate_ca_key}
      CA_KEY_PASSWORD: ${CA_KEY_PASSWORD:-}
      ROOT_CA_FILE: ${ROOT_CA_FILE:-root_ca.crt}
      # With no CA in PKI_DIR on first start, the manager creates one for ALLOWED_DOMAINS
      CA_AUTO_CREATE: ${CA_AUTO_CREATE:-true}
      HOST_IP: ${HOST_IP:-}
      # Old name for HOST_IP, still honoured
      PI_IP: ${PI_IP:-}
      CERT_VALIDITY_DAYS: ${CERT_VALIDITY_DAYS:-365}
      RENEW_BEFORE_DAYS: ${RENEW_BEFORE_DAYS:-30}
      RENEW_CHECK_HOURS: ${RENEW_CHECK_HOURS:-12}
      KEY_TYPE: ${KEY_TYPE:-rsa-2048}
      # GUI login: set it on the Settings page. These two are for setting it from the stack instead,
      # and for a forgotten password (RESET_LOGIN=true, then remove it again).
      BASIC_AUTH_USERS: ${BASIC_AUTH_USERS:-}
      RESET_LOGIN: ${RESET_LOGIN:-false}
      STATS_RETENTION_DAYS: ${STATS_RETENTION_DAYS:-90}
      ACCESS_LOG_MAX_MB: ${ACCESS_LOG_MAX_MB:-50}
      # Traffic page: every request and sign-in, with IP addresses, kept this many days (0 = off)
      TRAFFIC_RETENTION_DAYS: ${TRAFFIC_RETENTION_DAYS:-30}
      # Offer Let's Encrypt on the app form. Set ACME_DNS_PROVIDER and its credentials first.
      LETSENCRYPT_ENABLED: ${LETSENCRYPT_ENABLED:-false}
      # Google sign-in: on when COMPOSE_PROFILES includes sso (which also starts oauth2-proxy below).
      # The manager then offers "Require Google sign-in" on the app form, routes the sign-in page (auth.<SSO_DOMAIN>) to
      # oauth2-proxy and keeps its allow-list (Settings page). SSO_ENABLED=false forces it off.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      SSO_ENABLED: ${SSO_ENABLED:-}
      SSO_DOMAIN: ${SSO_DOMAIN:-}
      SSO_AUTH_URL: ${SSO_AUTH_URL:-http://oauth2-proxy:4180}
      # Name of the sign-in page; default auth.<SSO_DOMAIN>. Give each stack its own when two share SSO_DOMAIN.
      SSO_AUTH_HOST: ${SSO_AUTH_HOST:-}
      # Certificate for the sign-in page: internal (default), letsencrypt (needs LETSENCRYPT_ENABLED)
      # or wildcard (needs WILDCARD_DOMAIN)
      SSO_AUTH_CERT: ${SSO_AUTH_CERT:-internal}
      # The stack's Let's Encrypt wildcard (WILDCARD_DOMAIN and *.WILDCARD_DOMAIN), from gateway-acme below.
      # Set it, and add wildcard to COMPOSE_PROFILES, to offer "Shared wildcard" on the app form.
      WILDCARD_DOMAIN: ${WILDCARD_DOMAIN:-}
    volumes:
      - ${TM_ROOT:-/opt/traefik}/dynamic:/etc/traefik/dynamic
      - ${TM_ROOT:-/opt/traefik}/certs:/etc/traefik/certs
      - ${TM_ROOT:-/opt/traefik}/manager:/data
      # Read for usage stats, and truncated by the manager once it passes ACCESS_LOG_MAX_MB
      - ${TM_ROOT:-/opt/traefik}/logs:/var/log/traefik
      # Intermediate cert + key, and the root certificate. Writable so the manager can create the CA on
      # first start; it never overwrites a CA that is there. Keep no root key in these folders.
      - ${PKI_DIR:-/opt/traefik/pki}/intermediate:/pki/intermediate
      - ${PKI_DIR:-/opt/traefik/pki}/root:/pki/root
      # oauth2-proxy's allow-list (emails.txt), edited on the Settings page
      - ${TM_ROOT:-/opt/traefik}/oauth2-proxy:/oauth2-proxy
      # The wildcard certificate: read, checked, then listed for Traefik (and shown on Status)
      - ${TM_ROOT:-/opt/traefik}/wildcard:/etc/traefik/wildcard:ro
    networks: [proxy]
    depends_on: [traefik]

  # One Let's Encrypt wildcard certificate for this stack (WILDCARD_DOMAIN and *.WILDCARD_DOMAIN), from acme.sh
  # with a DNS challenge at Cloudflare. Only started with COMPOSE_PROFILES including wildcard.
  # A less trusted stack (a DMZ) runs neither container: a trusted stack gets its certificate with
  # gateway-acme-remote below and pushes it there. See "Wildcard certificate" in docs/guide.md.
  # No ports, and not on the proxy network: it only talks out (Let's Encrypt, Cloudflare).
  gateway-acme:
    image: ${TM_ACME_IMAGE:-ghcr.io/gjerdingc/gateway-acme}:${TM_VERSION:-latest}
    pull_policy: ${TM_PULL_POLICY:-always}
    container_name: gateway-acme
    profiles: [wildcard]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      WILDCARD_DOMAIN: ${WILDCARD_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # letsencrypt (default), letsencrypt_test (staging, untrusted certs) or a directory URL
      ACME_CA_SERVER: ${ACME_CA_SERVER:-letsencrypt}
      # The same Cloudflare token as Traefik's (Zone:DNS:Edit and Zone:Zone:Read on the zone)
      CF_Token: ${CF_DNS_API_TOKEN:-}
      CF_Zone_ID: ${CF_ZONE_ID:-}
    volumes:
      # acme.sh's account, settings and certificate. Holds the Cloudflare token too: back it up like a secret.
      - ${TM_ROOT:-/opt/traefik}/gateway-acme:/acme.sh
      # Where Traefik and the manager read the certificate (fullchain.pem, key.pem)
      - ${TM_ROOT:-/opt/traefik}/wildcard:/out

  # The wildcard certificate of ANOTHER, less trusted stack (a DMZ), kept here so that stack holds no DNS token
  # and never reaches the firewall. Its own key, separate from this stack's. Pushes every new certificate over
  # SSH to REMOTE_SSH_TARGET (where receive-wildcard.sh checks and installs it), and with PANOS_HOST set puts
  # it on the Palo Alto firewall for SSL Inbound Inspection. Only started with COMPOSE_PROFILES including
  # wildcard-remote. Not read by this stack's Traefik.
  gateway-acme-remote:
    image: ${TM_ACME_IMAGE:-ghcr.io/gjerdingc/gateway-acme}:${TM_VERSION:-latest}
    pull_policy: ${TM_PULL_POLICY:-always}
    container_name: gateway-acme-remote
    profiles: [wildcard-remote]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # The other stack's domain; by default the same as this stack's (a second certificate, its own key)
      WILDCARD_DOMAIN: ${REMOTE_WILDCARD_DOMAIN:-${WILDCARD_DOMAIN:-}}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_CA_SERVER: ${ACME_CA_SERVER:-letsencrypt}
      CF_Token: ${CF_DNS_API_TOKEN:-}
      CF_Zone_ID: ${CF_ZONE_ID:-}
      # user@host of the receiving account on the other stack's host, its SSH port and the folder there
      PUSH_SSH_TARGET: ${REMOTE_SSH_TARGET:-}
      PUSH_SSH_PORT: ${REMOTE_SSH_PORT:-22}
      PUSH_REMOTE_DIR: ${REMOTE_WILDCARD_DIR:-/opt/traefik/wildcard}
      # Firewall (leave PANOS_HOST empty to skip). An admin whose role allows only XML API import and
      # commit. PANOS_KEY is that admin's API key; or PANOS_PASS and acme.sh makes the key itself.
      PANOS_HOST: ${PANOS_HOST:-}
      PANOS_USER: ${PANOS_USER:-}
      PANOS_KEY: ${PANOS_KEY:-}
      PANOS_PASS: ${PANOS_PASS:-}
      # The certificate's name on the firewall, which the decryption policy points at
      PANOS_CERTNAME: ${PANOS_CERTNAME:-gateway-wildcard}
      # How to trust the firewall's web interface: a CA file inside the container (mount it), or false
      # to not check it (its default certificate is self-signed)
      PANOS_CA_FILE: ${PANOS_CA_FILE:-}
      PANOS_TLS_VERIFY: ${PANOS_TLS_VERIFY:-true}
    volumes:
      # acme.sh's account, settings, certificate and SSH key, and the Cloudflare token and firewall API key.
      # Back it up like a secret.
      - ${TM_ROOT:-/opt/traefik}/gateway-acme-remote:/acme.sh
      # The other stack's certificate as pushed (not read by this stack's Traefik)
      - ${TM_ROOT:-/opt/traefik}/wildcard-remote:/out

  # Google sign-in for the apps you pick. Only started with COMPOSE_PROFILES=sso; needs
  # SSO_DOMAIN and the three OAUTH_* values (see "Google sign-in" in docs/guide.md).
  # No host port: Traefik reaches it as http://oauth2-proxy:4180, browsers through auth.<SSO_DOMAIN> (or SSO_AUTH_HOST).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    container_name: oauth2-proxy
    profiles: [sso]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      # Encrypts the sign-in cookie. Made by the manager on first start and kept; delete the file and
      # redeploy to sign everyone out. OAUTH_COOKIE_SECRET, when set, is used instead of the file:
      # only for stacks that should share one sign-in (anyone with it can forge a sign-in for all of them).
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /etc/oauth2-proxy/cookie-secret
      # Give each stack its own name when two share SSO_DOMAIN, so their cookies don't overwrite each other.
      OAUTH2_PROXY_COOKIE_NAME: ${OAUTH_COOKIE_NAME:-_oauth2_proxy}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: https://${SSO_AUTH_HOST:-auth.${SSO_DOMAIN:-}}/oauth2/callback
      # One sign-in for every app under the domain
      OAUTH2_PROXY_COOKIE_DOMAINS: .${SSO_DOMAIN:-}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${SSO_DOMAIN:-}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      # Behind Traefik: trust X-Forwarded-* and answer ForwardAuth with identity headers
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SCOPE: openid email profile
      # Only these addresses may sign in: the list on the manager's Settings page.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/emails.txt
      # Log to a file the manager reads for sign-ins and refusals (Traffic page), instead of to the
      # container's output. Per-request lines are off: Traefik's access log already has them.
      OAUTH2_PROXY_LOGGING_FILENAME: /var/log/oauth2-proxy/oauth2-proxy.log
      OAUTH2_PROXY_LOGGING_MAX_SIZE: "10"
      OAUTH2_PROXY_LOGGING_MAX_BACKUPS: "3"
      OAUTH2_PROXY_LOGGING_MAX_AGE: "30"
      OAUTH2_PROXY_REQUEST_LOGGING: "false"
    volumes:
      # The folder, not the file: Docker would create a directory if the file were not there yet.
      # Until the manager has written it, oauth2-proxy exits and is restarted.
      - ${TM_ROOT:-/opt/traefik}/oauth2-proxy:/etc/oauth2-proxy:ro
      # Its log; the manager hands this folder to oauth2-proxy's user on start
      - ${TM_ROOT:-/opt/traefik}/oauth2-proxy/logs:/var/log/oauth2-proxy
    networks: [proxy]
    depends_on: [traefik-manager]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
