# Tests the manager, then builds its image for amd64, arm64 and armv7 and pushes it to
# ghcr.io/<owner>/traefik-manager, and the wildcard certificate container (acme/) to
# ghcr.io/<owner>/gateway-acme with the same tags.
#   push to main   -> :latest and :sha-<short>
#   tag v1.2.3     -> :1.2.3 and :1.2
#   pull request   -> test and build (amd64 only), nothing pushed
# Only when the manager, acme/, the compose file, the installer or this workflow change; docs-only pushes don't build.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]  # path filters do not apply to tags: a release tag always builds
    paths:
      - "manager/**"
      - "acme/**"
      - "docker-compose.yml"  # holds the Traefik version the integration test uses
      - "install.sh"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "manager/**"
      - "acme/**"
      - "docker-compose.yml"  # holds the Traefik version the integration test uses
      - "install.sh"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r manager/requirements.txt
      - name: Get the Traefik version the stack uses, for the integration test
        run: |
          version=$(grep -oP 'image: traefik:\Kv[0-9.]+' docker-compose.yml)
          curl -sSfL "https://github.com/traefik/traefik/releases/download/${version}/traefik_${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" traefik
          echo "TRAEFIK_BIN=$RUNNER_TEMP/traefik" >> "$GITHUB_ENV"
      - name: Run tests
        working-directory: manager
        run: python -m pytest -q
      - name: Check the gateway-acme scripts
        run: shellcheck -s sh acme/run.sh acme/tm_panos.sh acme/receive-wildcard.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/traefik-manager
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=traefik-manager
            org.opencontainers.image.description=Web GUI that issues certificates and writes Traefik config for each app
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: manager
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64,linux/arm/v7' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image name and tags (gateway-acme)
        id: meta-acme
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gateway-acme
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=gateway-acme
            org.opencontainers.image.description=acme.sh that keeps the gateway's Let's Encrypt wildcard and puts it on the firewall
      - name: Build and push (gateway-acme)
        uses: docker/build-push-action@v7
        with:
          context: acme
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64,linux/arm/v7' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-acme.outputs.tags }}
          labels: ${{ steps.meta-acme.outputs.labels }}
          cache-from: type=gha,scope=acme
          cache-to: type=gha,mode=max,scope=acme

  # Installs the stack with install.sh on a clean runner, using the image just pushed, and checks that
  # Traefik serves the manager with a certificate from the CA the manager created on first start.
  install:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FQDN: traefik.lab.example.test
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          sudo env GATEWAY_SOURCE="$PWD" GATEWAY_DOMAIN=lab.example.test HOST_IP=127.0.0.1 \
            LAN_CIDRS=0.0.0.0/0 TZ=UTC TM_VERSION="sha-${GITHUB_SHA::7}" ./install.sh --yes
      - name: Traefik serves the manager with a certificate from the new CA
        run: |
          curl -fsS http://127.0.0.1:8090/status/root_ca.crt -o root_ca.crt
          openssl x509 -in root_ca.crt -noout -subject -ext nameConstraints
          for i in $(seq 1 30); do
            if curl -fsS --cacert root_ca.crt --resolve "$FQDN:443:127.0.0.1" "https://$FQDN/" -o /dev/null; then
              echo "OK after $i tries"; exit 0
            fi
            sleep 2
          done
          docker logs traefik-manager | tail -50
          docker logs traefik | tail -50
          exit 1
      - name: Running the installer again updates in place
        run: |
          sudo env GATEWAY_SOURCE="$PWD" ./install.sh --yes | tee rerun.log
          grep -q "keeping its settings" rerun.log
          curl -fsS --cacert root_ca.crt --resolve "$FQDN:443:127.0.0.1" "https://$FQDN/" -o /dev/null
